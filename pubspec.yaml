name: service
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.6
  flutter:
    sdk: flutter
  fluttertoast: ^8.2.6
  google_fonts: ^6.2.1
  image_cropper: ^7.0.4
  image_picker: ^1.1.2
  intl: ^0.19.0
  razorpay_flutter: ^1.3.7
  shared_preferences: ^2.2.3
  smooth_page_indicator: ^1.1.0
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.0
  firebase_database: ^11.0.2
  email_auth: ^2.0.0
  pinput: ^5.0.0
  email_otp: ^3.0.1
  google_sign_in: ^6.2.1
  snippet_coder_utils: ^1.0.15

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true

  assets:
    - assets/images/painter/
    - assets/images/plumber/
    - assets/images/engineers/
    - assets/images/auto_mechanic/
    - assets/images/profile/
    - assets/logo/extra/
    - assets/images/accountactivation/
    - assets/images/Dashboard/
    - assets/
    - assets/images/otp/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: "AppIcon"
  image_path: "assets/app_Icon.jpg"